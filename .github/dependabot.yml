version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo-and-react-native:
        patterns:
          - expo
          - expo-*
          - react
          - react-dom
          - react-native
          - react-native-*
          - "@react-native-*"
      development-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
