name: Bug report
description: Report a reproducible problem in Context
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Context. Never include private relationship data, exported backups, or credentials.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS device
        - iOS simulator
        - Android device
        - Android emulator
        - Web
        - macOS desktop
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem without including private relationship data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Context version
      placeholder: 0.5.0
  - type: textarea
    id: environment
    attributes:
      label: Device and operating system
      placeholder: iPhone model, iOS version, or browser version
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed names, contact details, memories, backups, and credentials from this report.
          required: true
